schema_version = 1

# Filled in automatically per profile (~/.config/padshell/devices/*.toml):
# which controller the profile belongs to. `kind` picks the GUI's button
# labels; bindings always use the same names on every pad (cross = A,
# circle = B, square = X, triangle = Y, l1/r1 = LB/RB, l2/r2 = LT/RT,
# share = View/Back, options = Menu/Start, ps = Xbox/Guide,
# touchpad_click = the Xbox Series Share button). The Xbox names above
# are accepted as aliases in hand-written configs.
# [device]
# kind = "xbox"        # ds4 | xbox | generic
# name = "Xbox Wireless Controller"

[settings]
poll_hz = 250
stick_deadzone = 0.08

# ---- Mouse-mode layer: hold L1 to move the cursor with the right stick ----
[[layers]]
name = "mouse"
activate = { button = "l1", mode = "hold" }

  [layers.stick_mouse]
  stick = "right"
  sensitivity = 900.0
  accel_curve = "quadratic"

  [layers.scroll]
  stick = "left"
  axis = "y"
  sensitivity = 60.0

  [[layers.bindings]]
  input = "r2"
  action = { type = "mouse_button", button = "left" }

  [[layers.bindings]]
  input = "l2"
  action = { type = "mouse_button", button = "right" }

# ---- Default layer bindings ----
[[bindings]]
input = "cross"
action = { type = "key", key = "space" }

[[bindings]]
input = "triangle"
action = { type = "key", key = "enter" }

[[bindings]]
input = "circle"
action = { type = "key", key = "escape" }

[[bindings]]
input = "dpad_up"
action = { type = "key", key = "up" }

[[bindings]]
input = "dpad_down"
action = { type = "key", key = "down" }

[[bindings]]
input = "dpad_left"
action = { type = "key", key = "left" }

[[bindings]]
input = "dpad_right"
action = { type = "key", key = "right" }

[[bindings]]
input = { combo = ["l1", "r1"] }
action = { type = "key_combo", keys = ["super", "q"] }

[[bindings]]
input = "square"
action = { type = "macro", name = "screenshot" }

# Launch an app (any shell command, run detached via `sh -c`). The GUI's
# Bindings tab lists every desktop app wofi shows and fills this in for you.
[[bindings]]
input = "options"
action = { type = "launch", command = "firefox" }

[[macros]]
name = "screenshot"
steps = [
  { type = "key_combo", keys = ["super", "shift", "s"] },
]

# ---- Battery alerts: lightbar override when the battery gets low ----
# Applies while battery <= below_percent and not charging; lowest matching
# threshold wins. Normal lightbar state returns once charged above it.
[[battery_alerts]]
below_percent = 20
rumble = true           # one short rumble when the alert first triggers
  [battery_alerts.lightbar]
  mode = "fade"         # off | solid | rainbow | fade | strobe
  r = 255
  g = 0
  b = 0
  period_ms = 1500
