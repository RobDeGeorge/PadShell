<?xml version="1.0" encoding="UTF-8"?>
<!--
  DualShock 4 front view, drawn on the same 820x420 canvas ControllerDiagram.qml
  uses, so QML overlays can be placed by the coordinates listed here:
    L2/R2 triggers   : x 128..212 / 608..692, y 22..56
    L1/R1 shoulders  : x 118..222 / 598..702, y 60..86
    Touchpad         : x 325..495, y 88..178
    Share / Options  : centred (262,120) / (558,120), 14x30 pills
    D-pad centre     : (170,175), arm length 36, arm width 22
    Face centre      : (650,175), r 17, spread 40
    PS button        : (410,238) r 13
    Left / right stick: (285,250) / (535,250), well r 36, cap r 27
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3d44"/>
      <stop offset="0.45" stop-color="#2b2d33"/>
      <stop offset="1" stop-color="#1b1c20"/>
    </linearGradient>
    <linearGradient id="bodyEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5e68"/>
      <stop offset="1" stop-color="#0d0d10"/>
    </linearGradient>
    <linearGradient id="shoulder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4d55"/>
      <stop offset="1" stop-color="#26282d"/>
    </linearGradient>
    <linearGradient id="trigger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34363c"/>
      <stop offset="1" stop-color="#1e1f23"/>
    </linearGradient>
    <linearGradient id="touchpad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26282d"/>
      <stop offset="1" stop-color="#17181b"/>
    </linearGradient>
    <radialGradient id="well" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0a0a0c"/>
      <stop offset="0.75" stop-color="#101114"/>
      <stop offset="1" stop-color="#3a3d44"/>
    </radialGradient>
    <radialGradient id="btn" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#3d4048"/>
      <stop offset="1" stop-color="#1c1d21"/>
    </radialGradient>
    <linearGradient id="lightbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d5fa8" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#3d8bff"/>
      <stop offset="1" stop-color="#1d5fa8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Triggers (L2 / R2) sit behind the shoulders -->
  <g>
    <path d="M132,56 L128,34 C127,27 132,22 140,22 L200,22 C208,22 213,27 212,34 L208,56 Z" fill="url(#trigger)" stroke="#0e0e10" stroke-width="1.5"/>
    <path d="M612,56 L608,34 C607,27 612,22 620,22 L680,22 C688,22 693,27 692,34 L688,56 Z" fill="url(#trigger)" stroke="#0e0e10" stroke-width="1.5"/>
    <text x="170" y="44" font-family="sans-serif" font-size="13" font-weight="600" fill="#8a8d95" text-anchor="middle">L2</text>
    <text x="650" y="44" font-family="sans-serif" font-size="13" font-weight="600" fill="#8a8d95" text-anchor="middle">R2</text>
  </g>

  <!-- Shoulders (L1 / R1) -->
  <g>
    <path d="M118,86 C118,70 126,60 140,60 L200,60 C214,60 222,70 222,86 Z" fill="url(#shoulder)" stroke="#0e0e10" stroke-width="1.5"/>
    <path d="M598,86 C598,70 606,60 620,60 L680,60 C694,60 702,70 702,86 Z" fill="url(#shoulder)" stroke="#0e0e10" stroke-width="1.5"/>
    <text x="170" y="79" font-family="sans-serif" font-size="12" font-weight="600" fill="#9a9da5" text-anchor="middle">L1</text>
    <text x="650" y="79" font-family="sans-serif" font-size="12" font-weight="600" fill="#9a9da5" text-anchor="middle">R1</text>
  </g>

  <!-- Main body -->
  <path id="bodyPath"
        d="M130,100
           C180,80 300,74 410,74
           C520,74 640,80 690,100
           C740,120 775,190 785,270
           C795,340 770,402 720,410
           C680,416 650,382 630,342
           C612,306 566,304 522,296
           C470,286 350,286 298,296
           C254,304 208,306 190,342
           C170,382 140,416 100,410
           C50,402 25,340 35,270
           C45,190 80,120 130,100 Z"
        fill="url(#body)" stroke="url(#bodyEdge)" stroke-width="2"/>
  <!-- top highlight -->
  <path d="M150,100 C210,86 320,82 410,82 C500,82 610,86 670,100" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3" filter="url(#soft)"/>

  <!-- Light bar -->
  <rect x="335" y="76" width="150" height="5" rx="2.5" fill="url(#lightbar)" filter="url(#glow)"/>
  <rect x="335" y="76" width="150" height="5" rx="2.5" fill="url(#lightbar)"/>

  <!-- Touchpad -->
  <rect x="325" y="88" width="170" height="90" rx="14" fill="url(#touchpad)" stroke="#0c0c0e" stroke-width="1.5"/>
  <rect x="329" y="92" width="162" height="82" rx="11" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>

  <!-- Share / Options -->
  <g>
    <rect x="255" y="105" width="14" height="30" rx="7" fill="url(#btn)" stroke="#0c0c0e" stroke-width="1.2"/>
    <rect x="551" y="105" width="14" height="30" rx="7" fill="url(#btn)" stroke="#0c0c0e" stroke-width="1.2"/>
    <text x="262" y="150" font-family="sans-serif" font-size="8" letter-spacing="0.5" fill="#7d8088" text-anchor="middle">SHARE</text>
    <text x="558" y="150" font-family="sans-serif" font-size="8" letter-spacing="0.5" fill="#7d8088" text-anchor="middle">OPTIONS</text>
  </g>

  <!-- Speaker grille -->
  <g fill="#0f1013">
    <circle cx="380" cy="200" r="2"/><circle cx="390" cy="200" r="2"/><circle cx="400" cy="200" r="2"/>
    <circle cx="410" cy="200" r="2"/><circle cx="420" cy="200" r="2"/><circle cx="430" cy="200" r="2"/><circle cx="440" cy="200" r="2"/>
    <circle cx="385" cy="208" r="2"/><circle cx="395" cy="208" r="2"/><circle cx="405" cy="208" r="2"/>
    <circle cx="415" cy="208" r="2"/><circle cx="425" cy="208" r="2"/><circle cx="435" cy="208" r="2"/>
    <circle cx="390" cy="216" r="2"/><circle cx="400" cy="216" r="2"/><circle cx="410" cy="216" r="2"/>
    <circle cx="420" cy="216" r="2"/><circle cx="430" cy="216" r="2"/>
  </g>

  <!-- PS button -->
  <circle cx="410" cy="238" r="13" fill="url(#btn)" stroke="#0c0c0e" stroke-width="1.2"/>
  <text x="410" y="242.5" font-family="sans-serif" font-size="10" font-weight="700" fill="#a0a3ab" text-anchor="middle" font-style="italic">PS</text>

  <!-- D-pad -->
  <g>
    <path d="M159,139 h22 v25 l25,0 v22 h-25 v25 h-22 v-25 h-25 v-22 h25 z"
          fill="url(#btn)" stroke="#0c0c0e" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="170" cy="175" r="9" fill="#000" fill-opacity="0.25"/>
    <g fill="#8f929a">
      <path d="M170,146 l5,8 h-10 z"/>
      <path d="M170,204 l-5,-8 h10 z"/>
      <path d="M141,175 l8,-5 v10 z"/>
      <path d="M199,175 l-8,-5 v10 z"/>
    </g>
  </g>

  <!-- Face buttons -->
  <g stroke="#0c0c0e" stroke-width="1.5">
    <circle cx="650" cy="135" r="17" fill="url(#btn)"/>
    <circle cx="650" cy="215" r="17" fill="url(#btn)"/>
    <circle cx="610" cy="175" r="17" fill="url(#btn)"/>
    <circle cx="690" cy="175" r="17" fill="url(#btn)"/>
  </g>
  <g fill="none" stroke-width="2.2" stroke-linecap="round">
    <path d="M650,126 l8,15 h-16 z" stroke="#3fbf9a"/>
    <path d="M644,209 l12,12 M656,209 l-12,12" stroke="#6ea6ff"/>
    <rect x="603" y="168" width="14" height="14" stroke="#e58fc0"/>
    <circle cx="690" cy="175" r="7" stroke="#ff6b6b"/>
  </g>

  <!-- Stick wells -->
  <g stroke="#0a0a0c" stroke-width="1.5">
    <circle cx="285" cy="250" r="36" fill="url(#well)"/>
    <circle cx="535" cy="250" r="36" fill="url(#well)"/>
  </g>
</svg>
