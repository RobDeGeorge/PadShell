schema_version = 1

# Minimal, safe bindings for an end-to-end output test - no combos or
# macros that could close windows or take screenshots.
[[bindings]]
input = "cross"
action = { type = "key", key = "a" }

[[bindings]]
input = "circle"
action = { type = "key", key = "b" }

[[bindings]]
input = "triangle"
action = { type = "key", key = "c" }

[[bindings]]
input = "square"
action = { type = "key", key = "d" }

[[bindings]]
input = "dpad_up"
action = { type = "key", key = "up" }

[[bindings]]
input = "dpad_down"
action = { type = "key", key = "down" }

[[bindings]]
input = "dpad_left"
action = { type = "key", key = "left" }

[[bindings]]
input = "dpad_right"
action = { type = "key", key = "right" }
